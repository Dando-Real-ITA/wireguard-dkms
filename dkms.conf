# Dynamic Kernel Module Support configuration for WireGuard.

PACKAGE_NAME="wireguard"

SRCDIR="${BASH_SOURCE%/dkms.conf}"
VERSIONFILE="${SRCDIR}/dkms.package_version.conf"

if test ! -e "${VERSIONFILE}"; then
	PACKAGE_VERSION="$(sed -n 's/^#define[[:space:]]\+WIREGUARD_VERSION[[:space:]]\+"\([^"]\+\)"$/\1/p' "${SRCDIR}/version.h" | head -n 1)"
	if test -z "${PACKAGE_VERSION}"; then
		PACKAGE_VERSION="0unknown"
	fi
	if test -d "${SRCDIR}/.git"; then
		GITVER="$(git -C "${SRCDIR}" describe --always 2>/dev/null | tr - .)"
		test -z "${GITVER}" && GITVER="$(date +%Y%m%d)"
		PACKAGE_VERSION="${PACKAGE_VERSION}.git.${GITVER}"
	fi

	echo "# Automatically generated from dkms.conf on $(date -R)" > "${VERSIONFILE}"
	echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "${VERSIONFILE}"
fi

. "${VERSIONFILE}"

AUTOINSTALL="yes"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="wireguard"
BUILT_MODULE_LOCATION[0]="./"
DEST_MODULE_LOCATION[0]="/updates/dkms"

REMAKE_INITRD="yes"